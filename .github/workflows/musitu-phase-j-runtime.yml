name: MUSITU Phase J dependency acquisition

on:
  push:
    branches:
      - musitu-continuum-phase-j-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-j-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Restore exact MUSITU Phase J source
        shell: bash
        run: |
          set -euo pipefail
          cat musitu-phase-j-source.b64.part-* > musitu-phase-j-source.tar.gz.b64
          base64 -d musitu-phase-j-source.tar.gz.b64 > musitu-phase-j-source.tar.gz
          sha256sum -c MUSITU_PHASE_J_SOURCE_SHA256.txt
          tar -xzf musitu-phase-j-source.tar.gz
          sha256sum -c MUSITU_PHASE_J_SOURCE_FILES_SHA256.txt
          chmod +x scripts/phase-j-runtime-proof.sh

      - name: Install Go 1.27.1
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false

      - name: Acquire complete Go module lock
        env:
          MUSITU_PHASE_J_EVIDENCE_DIR: ${{ runner.temp }}/musitu-phase-j-runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${MUSITU_PHASE_J_EVIDENCE_DIR}"
          cd airgrid/transport/local-libp2p
          go mod tidy
          go mod verify
          go version
          cp go.mod "${MUSITU_PHASE_J_EVIDENCE_DIR}/airgrid-go.mod"
          cp go.sum "${MUSITU_PHASE_J_EVIDENCE_DIR}/airgrid-go.sum"
          sha256sum go.mod > "${MUSITU_PHASE_J_EVIDENCE_DIR}/airgrid-go.mod.sha256"
          sha256sum go.sum > "${MUSITU_PHASE_J_EVIDENCE_DIR}/airgrid-go.sum.sha256"
          echo '--- resolved go.mod ---'
          cat go.mod
          echo '--- resolved hashes ---'
          sha256sum go.mod go.sum

      - name: Verify Docker substrate
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Re-run MUSITU Phase J proof on resolved lock
        env:
          MUSITU_PHASE_J_EVIDENCE_DIR: ${{ runner.temp }}/musitu-phase-j-runtime
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/phase-j-runtime-proof.sh
          cp MUSITU_PHASE_J_SOURCE_SHA256.txt "${MUSITU_PHASE_J_EVIDENCE_DIR}/source-archive-sha256.txt"
          cp MUSITU_PHASE_J_SOURCE_FILES_SHA256.txt "${MUSITU_PHASE_J_EVIDENCE_DIR}/source-files-sha256.txt"
          printf '%s\n' "${GITHUB_SHA}" > "${MUSITU_PHASE_J_EVIDENCE_DIR}/github-execution-commit.txt"

      - name: Upload MUSITU Phase J acquisition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-phase-j-lock-acquisition-${{ github.run_id }}
          path: ${{ runner.temp }}/musitu-phase-j-runtime
          if-no-files-found: warn
