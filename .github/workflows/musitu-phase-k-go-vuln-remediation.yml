name: MUSITU Phase K Go vulnerability remediation

on:
  push:
    branches:
      - musitu-continuum-phase-k-go-vuln-audit
    paths:
      - '.github/workflows/musitu-phase-k-go-vuln-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  go-vulnerability-remediation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Restore exact locked MUSITU Go source
        shell: bash
        run: |
          set -euo pipefail
          cat musitu-phase-j-source.b64.part-* > musitu-phase-j-source.tar.gz.b64
          base64 -d musitu-phase-j-source.tar.gz.b64 > musitu-phase-j-source.tar.gz
          sha256sum -c MUSITU_PHASE_J_SOURCE_SHA256.txt
          tar -xzf musitu-phase-j-source.tar.gz
          sha256sum -c MUSITU_PHASE_J_SOURCE_FILES_SHA256.txt
          printf '%s  %s\n' '81a36799987a75c0101cdea29f6ae3752d12730425e5f12e1a6536226968b4da' 'airgrid/transport/local-libp2p/go.mod' | sha256sum -c -
          printf '%s  %s\n' '883d23a0f1508aea026c7a2fe82a6c60eff5ad53c924aa6112d5e038edc77a91' 'airgrid/transport/local-libp2p/go.sum' | sha256sum -c -

      - name: Install Go 1.27.1
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false

      - name: Apply minimum advisory fixes and run locked behavior tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/evidence" "${RUNNER_TEMP}/gobin"
          cd airgrid/transport/local-libp2p
          go get github.com/pion/dtls/v3@v3.1.4 github.com/pion/stun/v3@v3.1.5 golang.org/x/crypto@v0.56.0
          go mod tidy
          go mod verify
          go test ./... | tee "${RUNNER_TEMP}/evidence/go-test.txt"
          grep -F 'github.com/pion/dtls/v3 v3.1.4' go.mod
          grep -F 'github.com/pion/stun/v3 v3.1.5' go.mod
          grep -F 'golang.org/x/crypto v0.56.0' go.mod
          cp go.mod go.sum "${RUNNER_TEMP}/evidence/"
          sha256sum go.mod go.sum > "${RUNNER_TEMP}/evidence/remediated-go-lock-sha256.txt"
          go list -m all > "${RUNNER_TEMP}/evidence/go-list-modules.txt"

      - name: Install exact govulncheck scanner
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/gobin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "${RUNNER_TEMP}/gobin/govulncheck" -version | tee "${RUNNER_TEMP}/evidence/govulncheck-version.txt"
          go version -m "${RUNNER_TEMP}/gobin/govulncheck" > "${RUNNER_TEMP}/evidence/govulncheck-build-info.txt"
          go version > "${RUNNER_TEMP}/evidence/go-version.txt"

      - name: Scan remediated production and test-inclusive graphs
        shell: bash
        run: |
          set -euo pipefail
          ev="${RUNNER_TEMP}/evidence"
          cd airgrid/transport/local-libp2p
          "${RUNNER_TEMP}/gobin/govulncheck" -json ./... > "${ev}/govulncheck-production.json"
          "${RUNNER_TEMP}/gobin/govulncheck" ./... > "${ev}/govulncheck-production.txt" 2>&1
          "${RUNNER_TEMP}/gobin/govulncheck" -test -json ./... > "${ev}/govulncheck-tests.json"
          "${RUNNER_TEMP}/gobin/govulncheck" -test ./... > "${ev}/govulncheck-tests.txt" 2>&1
          python - "${ev}" <<'PY'
          import json, pathlib, sys
          ev=pathlib.Path(sys.argv[1])
          def parse(path):
              text=path.read_text(); dec=json.JSONDecoder(); i=0; out=[]
              while i < len(text):
                  while i < len(text) and text[i].isspace(): i += 1
                  if i >= len(text): break
                  obj,j=dec.raw_decode(text,i); out.append(obj); i=j
              findings=[]
              for obj in out:
                  if 'finding' not in obj: continue
                  f=obj['finding']; trace=f.get('trace') or []
                  last=trace[-1] if trace else {}
                  level='symbol' if last.get('function') else ('package' if last.get('package') else 'module')
                  findings.append({'osv':f.get('osv'),'fixed_version':f.get('fixed_version'),'level':level,'trace':trace})
              cfg=next((o['config'] for o in out if 'config' in o),{})
              return {'config':cfg,'findings':findings,'non_module_findings':[f for f in findings if f['level']!='module']}
          prod=parse(ev/'govulncheck-production.json')
          tests=parse(ev/'govulncheck-tests.json')
          result={'production':prod,'test_inclusive':tests,'status':'pass' if not prod['non_module_findings'] and not tests['non_module_findings'] else 'blocked','claim_boundary':'dependency_vulnerability_remediation_not_independent_security_review'}
          (ev/'audit-summary.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True,indent=2))
          if result['status'] != 'pass': raise SystemExit(2)
          PY
          printf '%s\n' "${GITHUB_SHA}" > "${ev}/execution-commit.txt"
          printf '%s\n' 'v1.7.0' > "${ev}/scanner-version-pin.txt"
          printf '%s\n' 'Minimum advisory remediation and current Go vulnerability scan only; not SAST, penetration testing, independent review, or production readiness.' > "${ev}/CLAIM_BOUNDARY.txt"

      - name: Upload Go remediation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-phase-k-go-vuln-remediation-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
