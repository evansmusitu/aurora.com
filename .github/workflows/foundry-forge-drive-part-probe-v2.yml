name: Foundry Forge authoritative Drive transport probe v2
on:
  push:
    branches:
      - foundry-forge-qualification-20260911
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe exact authoritative part00 with confirmation-aware downloader
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet gdown==5.2.0
          python3 - <<'PY'
          import gdown
          url='https://drive.google.com/uc?id=1XubGE5ov0s9VaGoDlyJN3jL1a66udVfq'
          out=gdown.download(url, 'part00', quiet=False, fuzzy=True)
          if out is None:
              raise SystemExit('gdown returned no file')
          PY
          size=$(stat -c '%s' part00)
          sha=$(sha256sum part00 | awk '{print $1}')
          printf 'size=%s\nsha256=%s\n' "$size" "$sha"
          test "$size" = '33554432'
          test "$sha" = '5aa349e032bf7c5dfa2daa95e04707f758181e20df2a6d581d7e86c097535121'
          echo 'AUTHORITATIVE_DRIVE_PART00_CONFIRMATION_AWARE_RETRIEVAL=PASS'
