name: MUSITU Cloudflare Corporate DNS Credential Discovery (Read Only)
on:
  push:
    branches: [ops/cf-dns-secret-readonly-20261106]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured Cloudflare credential names and GET zone access
        env:
          CANDIDATE_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANDIDATE_2: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          CANDIDATE_3: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          CANDIDATE_4: ${{ secrets.CF_DNS_API_TOKEN }}
          CANDIDATE_5: ${{ secrets.CF_API_TOKEN }}
          CANDIDATE_6: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          CANDIDATE_7: ${{ secrets.MUSITU_CORPORATE_DNS_API_TOKEN }}
          CANDIDATE_8: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CANDIDATE_9: ${{ secrets.CLOUDFLARE_EMAIL }}
          CANDIDATE_10: ${{ secrets.CLOUDFLARE_AUTH_EMAIL }}
          CANDIDATE_11: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          names=["CLOUDFLARE_API_TOKEN","CLOUDFLARE_DNS_API_TOKEN","CLOUDFLARE_DNS_TOKEN","CF_DNS_API_TOKEN","CF_API_TOKEN","CLOUDFLARE_ZONE_API_TOKEN","MUSITU_CORPORATE_DNS_API_TOKEN","CLOUDFLARE_GLOBAL_API_KEY","CLOUDFLARE_EMAIL","CLOUDFLARE_AUTH_EMAIL","CLOUDFLARE_API_KEY"]
          v={name:os.environ.get('CANDIDATE_'+str(i+1),'') for i,name in enumerate(names)}
          print('Available configured secret NAMES:',[name for name,val in v.items() if bool(val)])
          base='https://api.cloudflare.com/client/v4'
          seen=set()
          for name,tok in v.items():
           if not tok or name in ('CLOUDFLARE_EMAIL','CLOUDFLARE_AUTH_EMAIL'):continue
           if name in ('CLOUDFLARE_GLOBAL_API_KEY','CLOUDFLARE_API_KEY'):continue
           if tok in seen:continue
           seen.add(tok)
           req=urllib.request.Request(base+'/zones?name=mftintelligence.com&per_page=5',
             headers={'Authorization':'Bearer '+tok,'Accept':'application/json'},method='GET')
           try:
            with urllib.request.urlopen(req,timeout=16) as r:status=r.status;d=json.loads(r.read(160000))
           except urllib.error.HTTPError as e:
            status=e.code
            try:d=json.loads(e.read(160000))
            except Exception:d={}
           except Exception as e:
            print('Candidate',name,'network error type',type(e).__name__);continue
           zones=d.get('result') or []
           found=[z for z in zones if z.get('name')=='mftintelligence.com' and (z.get('account') or {}).get('id')=='93f395f5121954671f92fffa453d6b61']
           print('Candidate',name,'GET zone status',status,'matched corporate zone',len(found)==1,'error codes',[x.get('code') for x in (d.get('errors') or [])][:2])
          print('No secret values, tokens, emails or identifiers disclosed; no writes.')
          
          PY
