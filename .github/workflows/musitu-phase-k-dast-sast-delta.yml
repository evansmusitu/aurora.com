name: MUSITU Phase K DAST SAST delta proof

on:
  push:
    branches:
      - musitu-continuum-phase-k-dast-sast-delta
    paths:
      - '.github/workflows/musitu-phase-k-dast-sast-delta.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dast-sast-delta:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated execution branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct previously admitted SAST candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source
          cat phase-k-sast-proof/source.b64.part-* > work/source.tar.gz.b64
          base64 -d work/source.tar.gz.b64 > work/source.tar.gz
          printf '%s  %s\n' 'bb4642bca554ee1a5ac22d605aa77114508e90ea5c133364b95b85cc336c964c' 'work/source.tar.gz' | sha256sum -c -
          tar -xzf work/source.tar.gz -C work/source
          (cd work/source && sha256sum -c ../../phase-k-sast-proof/SOURCE_FILES_SHA256.txt)
          cat phase-k-sast-hardening/python-patch.b64.part-* > work/python-hardening.patch.b64
          base64 -d work/python-hardening.patch.b64 > work/python-hardening.patch
          printf '%s  %s\n' '6a63443bb44a9051207bf2bc6dca6974cce366b324992dab9afc26347ba73f59' 'work/python-hardening.patch' | sha256sum -c -
          (cd work/source && patch -p1 < ../python-hardening.patch)
          (cd work/source && sha256sum -c ../../phase-k-sast-hardening/CANDIDATE_SOURCE_FILES_SHA256.txt)

      - name: Apply exact DAST remediation delta and verify production bytes
        shell: bash
        run: |
          set -euo pipefail
          cat phase-k-dast-sast-delta/patch.b64.part-* > work/dast.patch.b64
          base64 -d work/dast.patch.b64 > work/dast.patch
          printf '%s  %s\n' 'dd80d1ff5392606eb6aa147bc2e44125b2dd225c14bdfd28bffc92cf8a8634d3' 'work/dast.patch' | sha256sum -c -
          (cd work/source && patch -p1 < ../dast.patch)
          printf '%s  %s\n' '858c8e8b2dc3da292ccdbf5844b80aaa9ca26306ef2e1a5d9ed2e60b973f3e63' 'phase-k-dast-sast-delta/PRODUCTION_SOURCE_FILES_SHA256.txt' | sha256sum -c -
          (cd work/source && sha256sum -c ../../phase-k-dast-sast-delta/PRODUCTION_SOURCE_FILES_SHA256.txt)
          printf '%s  %s\n' '0d0584950cc63d51b3066565284c87d7f321aefadd2e8ecc1439967e4be7559f' 'work/source/apps/musitu-mobile/musitu_mobile/server.py' | sha256sum -c -
          printf '%s  %s\n' '4ba236f6b83518ca3588357aafac18e43c5464681c5616fdee9e3432372a3b64' 'work/source/services/network-api/musitu_control/server.py' | sha256sum -c -

      - name: Install pinned Bandit scanner
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --disable-pip-version-check 'bandit==1.9.4'
          bandit --version

      - name: Scan changed production modules and preserve raw findings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          bandit \
            work/source/apps/musitu-mobile/musitu_mobile/server.py \
            work/source/services/network-api/musitu_control/server.py \
            -f json -o evidence/bandit-delta.json
          status=$?
          set -e
          printf '%s\n' "$status" > evidence/bandit-exit-code.txt
          test -s evidence/bandit-delta.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/bandit-delta.json').read_text(encoding='utf-8'))
          results=report.get('results',[])
          summary={
              'results': len(results),
              'severity': {level: sum(1 for item in results if item.get('issue_severity') == level) for level in ('HIGH','MEDIUM','LOW')},
              'errors': report.get('errors',[]),
              'scanned_files': [
                  'apps/musitu-mobile/musitu_mobile/server.py',
                  'services/network-api/musitu_control/server.py',
              ],
          }
          Path('evidence/bandit-delta-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Assemble delta evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 --version > evidence/python-version.txt 2>&1 || true
          bandit --version > evidence/bandit-version.txt 2>&1 || true
          cp phase-k-dast-sast-delta/PRODUCTION_SOURCE_FILES_SHA256.txt evidence/
          sha256sum work/dast.patch > evidence/dast-patch-sha256.txt 2>&1 || true
          printf '%s\n' "${GITHUB_SHA}" > evidence/GITHUB_EXECUTION_COMMIT.txt
          printf '%s\n' 'Incremental Bandit proof for the only two production Python files changed by MUSITU Phase K DAST remediation. The prior full hardened SAST proof remains required for unchanged production files.' > evidence/EVIDENCE_CHAIN.txt
          printf '%s\n' 'Internal SAST delta evidence only; this is not DAST, independent penetration testing, production security review, or production readiness.' > evidence/CLAIM_BOUNDARY.txt

      - name: Upload SAST delta evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-phase-k-dast-sast-delta-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
