name: Foundry Forge exact dependency qualification

on:
  workflow_dispatch:
  push:
    branches:
      - foundry-forge-qualification-20260911
    paths:
      - .github/workflows/foundry-forge-qualification.yml

permissions:
  contents: read

jobs:
  qualify-linux-cpython31213:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup exact CPython 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Acquire, hash and qualify exact pinned wheels
        shell: bash
        run: |
          set -euo pipefail
          python -VV
          python - <<'PY'
          import platform, sys
          assert sys.version_info[:3] == (3, 12, 13), sys.version
          libc, libc_version = platform.libc_ver()
          assert libc == 'glibc', (libc, libc_version)
          assert tuple(int(x) for x in libc_version.split('.')[:2]) >= (2, 34), libc_version
          assert platform.machine() == 'x86_64', platform.machine()
          print('runtime=PASS', platform.platform(), libc, libc_version)
          PY

          rm -rf qualification
          mkdir -p qualification/wheels
          for pkg in cryptography pypdf pypdfium2 cffi pycparser; do mkdir -p "qualification/extracted/$pkg"; done

          CRYPTO='qualification/wheels/cryptography-50.0.1-cp39-abi3-manylinux_2_34_x86_64.whl'
          PYPDF='qualification/wheels/pypdf-6.18.0-py3-none-any.whl'
          PDFIUM='qualification/wheels/pypdfium2-5.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl'
          CFFI='qualification/wheels/cffi-2.1.1-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl'
          PYCPARSER='qualification/wheels/pycparser-3.0-py3-none-any.whl'

          curl --fail --location --retry 3 --silent --show-error 'https://files.pythonhosted.org/packages/8c/eb/5d7124083e8d8cda8f5b348f544b71ad6f707ad63193758ef4d8e569da02/cryptography-50.0.1-cp39-abi3-manylinux_2_34_x86_64.whl' --output "$CRYPTO"
          curl --fail --location --retry 3 --silent --show-error 'https://files.pythonhosted.org/packages/c7/a5/d5922a078c9a612327681d4793404f82998f4d66213add6fdc0659245856/pypdf-6.18.0-py3-none-any.whl' --output "$PYPDF"
          curl --fail --location --retry 3 --silent --show-error 'https://files.pythonhosted.org/packages/d3/7c/74a2fb48e5b0d2402d9ca64b39074c722d67e9a8a2c58449a843a8c2329a/pypdfium2-5.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl' --output "$PDFIUM"
          curl --fail --location --retry 3 --silent --show-error 'https://files.pythonhosted.org/packages/b1/db/dceb9dd5b231e1da801793f8acc9f3c52a7e1afe40bb1aae37e02b0faad5/cffi-2.1.1-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl' --output "$CFFI"
          curl --fail --location --retry 3 --silent --show-error 'https://files.pythonhosted.org/packages/0c/c3/44f3fbbfa403ea2a7c779186dc20772604442dde72947e7d01069cbe98e3/pycparser-3.0-py3-none-any.whl' --output "$PYCPARSER"

          printf '%s  %s\n' '9dde0a357190eb3b1da1bb9ab750e9c85cba82ca5977aa0836cbb94e92611239' "$CRYPTO" | sha256sum -c -
          printf '%s  %s\n' '05b762b77bcb9dcb4a7c91fcf5dded585b25bee7269ab3d3001d7c55fa1b324b' "$PYPDF" | sha256sum -c -
          printf '%s  %s\n' '81df25c1ab4c13ff773102d3cbea1967511d079123b067fc077bd0c4d57d91d8' "$PDFIUM" | sha256sum -c -
          printf '%s  %s\n' 'c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf' "$CFFI" | sha256sum -c -
          printf '%s  %s\n' 'b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992' "$PYCPARSER" | sha256sum -c -

          python -m zipfile -e "$CRYPTO" qualification/extracted/cryptography
          python -m zipfile -e "$PYPDF" qualification/extracted/pypdf
          python -m zipfile -e "$PDFIUM" qualification/extracted/pypdfium2
          python -m zipfile -e "$CFFI" qualification/extracted/cffi
          python -m zipfile -e "$PYCPARSER" qualification/extracted/pycparser

          PYTHONPATH="$PWD/qualification/extracted/cryptography:$PWD/qualification/extracted/pypdf:$PWD/qualification/extracted/pypdfium2:$PWD/qualification/extracted/cffi:$PWD/qualification/extracted/pycparser" python - <<'PY'
          import hashlib, importlib.metadata, json, pathlib, platform, sys, tempfile
          import cffi, cryptography, pycparser, pypdf, pypdfium2
          from cryptography.hazmat.bindings.openssl.binding import Binding
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from pypdf import PdfReader, PdfWriter

          assert sys.version_info[:3] == (3, 12, 13), sys.version
          assert cryptography.__version__ == '50.0.1'
          assert pypdf.__version__ == '6.18.0'
          assert importlib.metadata.version('pypdfium2') == '5.13.0'
          assert importlib.metadata.version('cffi') == '2.1.1'
          assert importlib.metadata.version('pycparser') == '3.0'

          crypto_meta = pathlib.Path('qualification/extracted/cryptography/cryptography-50.0.1.dist-info/METADATA').read_text(encoding='utf-8')
          assert "Requires-Dist: cffi>=2.0.0 ; platform_python_implementation != 'PyPy'" in crypto_meta
          cffi_meta = pathlib.Path('qualification/extracted/cffi/cffi-2.1.1.dist-info/METADATA').read_text(encoding='utf-8')
          assert 'Requires-Dist: pycparser' in cffi_meta

          private = Ed25519PrivateKey.generate()
          message = b'MUSITU Foundry Forge qualification'
          signature = private.sign(message)
          private.public_key().verify(signature, message)
          binding = Binding()
          openssl_version = binding.ffi.string(binding.lib.OpenSSL_version(0)).decode('ascii')
          assert openssl_version.startswith('OpenSSL 4.0.2 '), openssl_version

          with tempfile.TemporaryDirectory() as td:
              path = pathlib.Path(td) / 'probe.pdf'
              writer = PdfWriter(); writer.add_blank_page(width=72, height=72)
              with path.open('wb') as handle: writer.write(handle)
              assert len(PdfReader(str(path)).pages) == 1
              doc = pypdfium2.PdfDocument(str(path)); assert len(doc) == 1
              page = doc[0]; bitmap = page.render(scale=1)
              assert bitmap.width > 0 and bitmap.height > 0
              bitmap.close(); page.close(); doc.close()

          specs = {
              'cryptography': ('cryptography-50.0.1-cp39-abi3-manylinux_2_34_x86_64.whl','9dde0a357190eb3b1da1bb9ab750e9c85cba82ca5977aa0836cbb94e92611239'),
              'pypdf': ('pypdf-6.18.0-py3-none-any.whl','05b762b77bcb9dcb4a7c91fcf5dded585b25bee7269ab3d3001d7c55fa1b324b'),
              'pypdfium2': ('pypdfium2-5.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl','81df25c1ab4c13ff773102d3cbea1967511d079123b067fc077bd0c4d57d91d8'),
              'cffi': ('cffi-2.1.1-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl','c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf'),
              'pycparser': ('pycparser-3.0-py3-none-any.whl','b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992'),
          }
          wheels={}
          for name,(filename,expected) in specs.items():
              p=pathlib.Path('qualification/wheels')/filename; actual=hashlib.sha256(p.read_bytes()).hexdigest(); assert actual==expected
              wheels[name]={'filename':filename,'sha256':actual,'bytes':p.stat().st_size}
          libc, libc_version = platform.libc_ver()
          report={
              'schema':'musitu.foundry_forge.target_dependency_qualification.v2',
              'qualified':True,
              'runtime':{'python':platform.python_version(),'implementation':platform.python_implementation(),'machine':platform.machine(),'platform':platform.platform(),'libc':libc,'libc_version':libc_version},
              'wheels':wheels,
              'checks':{'cryptography_version':cryptography.__version__,'embedded_openssl':openssl_version,'ed25519_sign_verify':'PASS','pypdf_version':pypdf.__version__,'pypdf_read_write_smoke':'PASS','pypdfium2_version':importlib.metadata.version('pypdfium2'),'pypdfium2_render_smoke':'PASS','cffi_version':importlib.metadata.version('cffi'),'pycparser_version':importlib.metadata.version('pycparser'),'transitive_metadata_chain':'PASS'},
              'truth_boundary':{'python_dependency_bytes_acquired':True,'python_dependency_target_runtime_qualified':True,'tesseract_5_5_3_qualified':False,'target_cpython312_fully_qualified':False,'qualified_dependency_bytes_complete':False,'production_authorized':False},
          }
          pathlib.Path('qualification/DEPENDENCY_QUALIFICATION_CP31213.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Upload exact wheel bytes and receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: foundry-forge-python-dependency-qualification
          path: qualification/
          if-no-files-found: error
          retention-days: 30
