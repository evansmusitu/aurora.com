name: MUSITU Studio Provider Read-only Preflight
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ops/tests -v
      - run: python -m pip install --disable-pip-version-check -q 'modal>=1.5,<2'
      - name: Inspect provider accounts using existing secrets, no writes
        env:
          STUDIO_CF_ACCOUNT_ID: ${{ vars.STUDIO_CF_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python ops/provider_readonly_preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: musitu-studio-sanitized-provider-inventory
          path: studio-provider-preflight.json
          retention-days: 7
          if-no-files-found: error
