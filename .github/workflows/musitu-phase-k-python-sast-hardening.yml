name: MUSITU Phase K Python SAST hardening proof

on:
  push:
    branches:
      - musitu-continuum-phase-k-sast-hardening
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  python-sast-hardening:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated execution branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct verified base and exact hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source
          cat phase-k-sast-proof/source.b64.part-* > work/source.tar.gz.b64
          base64 -d work/source.tar.gz.b64 > work/source.tar.gz
          printf '%s  %s\n' 'bb4642bca554ee1a5ac22d605aa77114508e90ea5c133364b95b85cc336c964c' 'work/source.tar.gz' | sha256sum -c -
          tar -xzf work/source.tar.gz -C work/source
          (cd work/source && sha256sum -c ../../phase-k-sast-proof/SOURCE_FILES_SHA256.txt)
          test "$(find work/source -type f -name '*.py' | wc -l)" -eq 44
          test "$(find work/source -type f | wc -l)" -eq 44
          cat phase-k-sast-hardening/python-patch.b64.part-* > work/python-hardening.patch.b64
          base64 -d work/python-hardening.patch.b64 > work/python-hardening.patch
          printf '%s  %s\n' '6a63443bb44a9051207bf2bc6dca6974cce366b324992dab9afc26347ba73f59' 'work/python-hardening.patch' | sha256sum -c -
          (cd work/source && patch -p1 < ../python-hardening.patch)
          (cd work/source && sha256sum -c ../../phase-k-sast-hardening/CANDIDATE_SOURCE_FILES_SHA256.txt)
          test "$(find work/source -type f -name '*.py' | wc -l)" -eq 44
          test "$(find work/source -type f | wc -l)" -eq 44

      - name: Install pinned Bandit scanner
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --disable-pip-version-check 'bandit==1.9.4'
          bandit --version

      - name: Run Bandit and preserve raw findings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          bandit -r work/source -f json -o evidence/bandit.json
          status=$?
          set -e
          printf '%s\n' "$status" > evidence/bandit-exit-code.txt
          test -s evidence/bandit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evidence/bandit.json').read_text(encoding='utf-8'))
          results = report.get('results', [])
          severity = {}
          confidence = {}
          for item in results:
              severity[item.get('issue_severity', 'UNKNOWN')] = severity.get(item.get('issue_severity', 'UNKNOWN'), 0) + 1
              confidence[item.get('issue_confidence', 'UNKNOWN')] = confidence.get(item.get('issue_confidence', 'UNKNOWN'), 0) + 1
          summary = {
              'results': len(results),
              'severity': severity,
              'confidence': confidence,
              'errors': report.get('errors', []),
              'metrics': report.get('metrics', {}).get('_totals', {}),
          }
          Path('evidence/bandit-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Assemble SAST evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 --version > evidence/python-version.txt 2>&1 || true
          bandit --version > evidence/bandit-version.txt 2>&1 || true
          python3 -m pip freeze > evidence/pip-freeze.txt 2>&1 || true
          cp phase-k-sast-proof/SOURCE_ARCHIVE_SHA256.txt evidence/BASE_SOURCE_ARCHIVE_SHA256.txt
          cp phase-k-sast-hardening/CANDIDATE_SOURCE_FILES_SHA256.txt evidence/
          sha256sum work/python-hardening.patch > evidence/python-hardening-patch-sha256.txt 2>&1 || true
          printf '%s\n' '5ebe226a1b5d77bcf070decffc6c508d8bd552ba + exact eight-Python-file SAST hardening candidate; Docker host opt-in is verified separately by runtime reproof.' > evidence/CANONICAL_CANDIDATE.txt
          printf '%s\n' "${GITHUB_SHA}" > evidence/GITHUB_EXECUTION_COMMIT.txt
          printf '%s\n' 'MUSITU Phase K Python SAST hardening evidence only. This does not satisfy DAST, independent penetration testing, DPIA, telecom regulatory gates, production readiness, or RF hardware validation.' > evidence/CLAIM_BOUNDARY.txt

      - name: Upload raw SAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-phase-k-python-sast-hardening-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
