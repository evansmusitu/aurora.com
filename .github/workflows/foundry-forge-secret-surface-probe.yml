name: FOUNDRY FORGE Secret Surface Probe

on:
  push:
    branches:
      - foundry-forge-secret-surface-probe-20260913
    paths:
      - '.github/workflows/foundry-forge-secret-surface-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          for k in ('MODAL_TOKEN_ID','MODAL_TOKEN_SECRET','CLOUDFLARE_GLOBAL_API_KEY'):
              print(f'{k}_PRESENT={str(bool(os.environ.get(k))).lower()}')
          PY
