name: MUSITU Phase K Rust lock proof

on:
  push:
    branches: [musitu-continuum-phase-k-rust-lock]
    paths:
      - 'phase-k-rust-lock/**'
      - '.github/workflows/musitu-phase-k-rust-lock.yml'

permissions:
  contents: read
  actions: read

jobs:
  rust-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify exact MUSITU Matrix source bytes
        shell: bash
        run: |
          set -euo pipefail
          cd phase-k-rust-lock/matrix-online
          echo '4646a000220a00415c9a1f31187bc78e6293535ef93a888e7512aff0656bd94d  Cargo.toml' | sha256sum -c -
          echo '741105ac666a38a569834baf6e6c990eb897357e113924d41ba43019faa9a7cc  src/lib.rs' | sha256sum -c -
          echo '8b77785b25a56f4e18a7339fdf615d16ae7086907826497523f6d8613f16aa3e  tests/contract.rs' | sha256sum -c -
          echo 'f5b187e39f6465376e2721bc273b9af276d8417ac1b2ef3a6cf6082ef9ba77c0  tests/live_synapse.rs' | sha256sum -c -
          echo '3a5841f91be1298f75ca77bd896cdc6c9c34bd61ca8cc64615073998be24c439  tests/live_encrypted_synapse.rs' | sha256sum -c -

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal
          rustup override set 1.93.0 --path phase-k-rust-lock/matrix-online
          rustc +1.93.0 --version | tee rustc-version.txt
          cargo +1.93.0 --version | tee cargo-version.txt

      - name: Generate and verify Cargo lock
        shell: bash
        run: |
          set -euo pipefail
          cd phase-k-rust-lock/matrix-online
          cargo +1.93.0 generate-lockfile
          test -s Cargo.lock
          cargo +1.93.0 test --locked
          cargo +1.93.0 metadata --locked --format-version 1 > cargo-metadata.json
          sha256sum Cargo.lock > CARGO_LOCK_SHA256.txt
          sha256sum Cargo.toml src/lib.rs tests/contract.rs tests/live_synapse.rs tests/live_encrypted_synapse.rs > SOURCE_SHA256.txt

      - name: Assemble evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp phase-k-rust-lock/matrix-online/Cargo.lock evidence/
          cp phase-k-rust-lock/matrix-online/CARGO_LOCK_SHA256.txt evidence/
          cp phase-k-rust-lock/matrix-online/SOURCE_SHA256.txt evidence/
          cp phase-k-rust-lock/matrix-online/cargo-metadata.json evidence/
          cp rustc-version.txt cargo-version.txt evidence/
          printf '%s\n' '${{ github.sha }}' > evidence/EXECUTION_COMMIT.txt
          printf '%s\n' 'MUSITU Phase K Rust dependency lock generated from exact current Matrix crate bytes; production readiness not implied.' > evidence/CLAIM_BOUNDARY.txt

      - name: Upload Rust lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-phase-k-rust-lock-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
