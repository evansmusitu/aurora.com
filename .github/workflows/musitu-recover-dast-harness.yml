name: MUSITU recover exact DAST harness

on:
  push:
    branches:
      - musitu-continuum-phase-k-recover-dast-harness

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reconstruct exact harness
        shell: bash
        run: |
          set -euo pipefail
          cat phase-k-dast-remediation-proof/harness.b64.part-* > harness.b64
          base64 -d harness.b64 > phase_k_dast_harness.py
          printf '%s  %s\n' '6f3ae6527d927e69444be92755b63fad8dc0d261843eef91942f96559ea91b1e' phase_k_dast_harness.py | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: musitu-exact-dast-harness-${{ github.run_id }}
          path: phase_k_dast_harness.py
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
