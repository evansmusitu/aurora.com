name: Foundry Forge exact target runtime bundle

on:
  push:
    branches:
      - foundry-forge-qualification-20260911
    paths:
      - .github/workflows/foundry-forge-target-runtime-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set up exact CPython 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          architecture: x64
          cache: ''

      - name: Verify exact target platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          python - <<'PY'
          import json, platform, sys
          assert sys.version_info[:3] == (3, 12, 13), sys.version
          assert platform.system() == 'Linux', platform.system()
          assert platform.machine() == 'x86_64', platform.machine()
          libc_name, libc_ver = platform.libc_ver()
          assert libc_name == 'glibc', (libc_name, libc_ver)
          assert libc_ver == '2.39', libc_ver
          out = {'python': platform.python_version(), 'implementation': platform.python_implementation(), 'system': platform.system(), 'machine': platform.machine(), 'libc': {'name': libc_name, 'version': libc_ver}, 'executable': sys.executable, 'prefix': sys.prefix}
          open('runtime-evidence/PLATFORM.json','w').write(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, sort_keys=True))
          PY

      - name: Recreate exact qualified Tesseract 5.5.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config make g++ ca-certificates curl git \
            libleptonica-dev=1.82.0-3build4 libpng-dev=1.6.43-5ubuntu0.6 \
            libjpeg-dev=8c-2ubuntu11 libtiff-dev=4.5.1+git230720-4ubuntu2.5 \
            zlib1g-dev=1:1.3.dfsg-3.1ubuntu2.2 libwebp-dev=1.3.2-0.4build3 \
            libopenjp2-7-dev=2.5.0-2ubuntu0.5 libcairo2-dev=1.18.0-3build1 \
            libpango1.0-dev=1.52.1+ds-1build1 libicu-dev=74.2-1ubuntu3.1 \
            libarchive-dev=3.7.2-2ubuntu0.8 libcurl4-openssl-dev=8.5.0-2ubuntu10.13 \
            librsvg2-bin=2.58.0+dfsg-1build1 fonts-dejavu-core=2.37-8
          dpkg-query -W -f='${Package}\t${Version}\n' \
            libleptonica-dev libpng-dev libjpeg-dev libtiff-dev zlib1g-dev \
            libwebp-dev libopenjp2-7-dev libcairo2-dev libpango1.0-dev \
            libicu-dev libarchive-dev libcurl4-openssl-dev librsvg2-bin fonts-dejavu-core \
            | sort > runtime-evidence/BUILD_DEPENDENCIES.tsv

          git init tesseract-src
          git -C tesseract-src remote add origin https://github.com/tesseract-ocr/tesseract.git
          git -C tesseract-src fetch --depth 1 origin refs/tags/5.5.3:refs/tags/5.5.3
          TAG_OBJECT=$(git -C tesseract-src rev-parse 'refs/tags/5.5.3^{tag}')
          COMMIT=$(git -C tesseract-src rev-parse 'refs/tags/5.5.3^{commit}')
          test "$TAG_OBJECT" = '6951ffe10ce031374bcd04fe400811da1e7e04ad'
          test "$COMMIT" = 'db0ec62f81b0737fbbe184d8fea40af5738f8eef'
          git -C tesseract-src checkout --detach "$COMMIT"
          pushd tesseract-src
          ./autogen.sh
          ./configure --prefix="$GITHUB_WORKSPACE/tesseract-5.5.3"
          make -j2
          make install
          popd

          echo '6ad0afbf020337487c0d103421e430f5e22ed8eefc0eb7420af002a850d1a1e8  tesseract-5.5.3/bin/tesseract' | sha256sum -c -
          TESSDATA_COMMIT='87416418657359cb625c412a48b6e1d6d41c29bd'
          mkdir -p tesseract-5.5.3/share/tessdata
          for lang in eng osd; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/${TESSDATA_COMMIT}/${lang}.traineddata" -o "tesseract-5.5.3/share/tessdata/${lang}.traineddata"
          done
          echo '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  tesseract-5.5.3/share/tessdata/eng.traineddata' | sha256sum -c -
          echo '9cf5d576fcc47564f11265841e5ca839001e7e6f38ff7f7aacf46d15a96b00ff  tesseract-5.5.3/share/tessdata/osd.traineddata' | sha256sum -c -
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/tesseract-5.5.3/lib" TESSDATA_PREFIX="$GITHUB_WORKSPACE/tesseract-5.5.3/share/tessdata" tesseract-5.5.3/bin/tesseract --list-langs | tee runtime-evidence/TESSERACT_LANGS.txt
          grep -Fx 'eng' runtime-evidence/TESSERACT_LANGS.txt
          grep -Fx 'osd' runtime-evidence/TESSERACT_LANGS.txt

      - name: Capture exact runtime rootfs and library closure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/runtime-rootfs"
          PYBASE=$(python -c 'import sys; print(sys.prefix)')
          mkdir -p "$ROOT$(dirname "$PYBASE")" "$ROOT/opt/musitu" "$ROOT/etc"
          cp -a "$PYBASE" "$ROOT$(dirname "$PYBASE")/"
          cp -a "$GITHUB_WORKSPACE/tesseract-5.5.3" "$ROOT/opt/musitu/"
          cp -a /etc/os-release "$ROOT/etc/os-release"
          mkdir -p "$ROOT/usr/bin" "$ROOT/bin"
          cp -a /usr/bin/env "$ROOT/usr/bin/env"
          cp -a /bin/sh "$ROOT/bin/sh"

          python - <<'PY'
          from pathlib import Path
          import os, re, shutil, subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])/'runtime-rootfs'
          pybase=Path(subprocess.check_output(['python','-c','import sys;print(sys.prefix)'], text=True).strip())
          seeds=[Path('/usr/bin/env'),Path('/bin/sh'),Path(os.environ['GITHUB_WORKSPACE'])/'tesseract-5.5.3/bin/tesseract',Path(os.environ['GITHUB_WORKSPACE'])/'tesseract-5.5.3/lib/libtesseract.so.5.0.5']
          for p in pybase.rglob('*'):
              if p.is_file() and (os.access(p, os.X_OK) or '.so' in p.name): seeds.append(p)
          deps=set()
          for seed in seeds:
              try: out=subprocess.check_output(['ldd',str(seed)],stderr=subprocess.DEVNULL,text=True)
              except Exception: continue
              for line in out.splitlines():
                  for m in re.finditer(r'(/[^\s()]+)',line):
                      p=Path(m.group(1))
                      if p.exists(): deps.add(p)
          for p in sorted(deps):
              real=Path(os.path.realpath(p))
              for src in {p,real}:
                  dst=root/src.relative_to('/')
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  if src.is_symlink():
                      if dst.exists() or dst.is_symlink(): dst.unlink()
                      os.symlink(os.readlink(src),dst)
                  elif src.is_file(): shutil.copy2(src,dst)
          print('dependency_files',len(deps))
          PY

          PYEXE="$PYBASE/bin/python3.12"
          sudo chroot "$ROOT" "$PYEXE" - <<'PY'
          import json, platform, sys
          assert sys.version_info[:3] == (3,12,13), sys.version
          assert platform.machine() == 'x86_64', platform.machine()
          assert platform.libc_ver() == ('glibc','2.39'), platform.libc_ver()
          print(json.dumps({'python':platform.python_version(),'machine':platform.machine(),'libc':platform.libc_ver()},sort_keys=True))
          PY
          sudo chroot "$ROOT" /usr/bin/env LD_LIBRARY_PATH=/opt/musitu/tesseract-5.5.3/lib TESSDATA_PREFIX=/opt/musitu/tesseract-5.5.3/share/tessdata /opt/musitu/tesseract-5.5.3/bin/tesseract --list-langs | tee runtime-evidence/CHROOT_TESSERACT_LANGS.txt
          grep -Fx 'eng' runtime-evidence/CHROOT_TESSERACT_LANGS.txt
          grep -Fx 'osd' runtime-evidence/CHROOT_TESSERACT_LANGS.txt

      - name: Hash and package exact runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,stat
          root=Path('runtime-rootfs')
          rows=[]
          for p in sorted(root.rglob('*'), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if p.is_symlink(): rows.append({'path':rel,'type':'symlink','target':os.readlink(p)})
              elif p.is_file():
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append({'path':rel,'type':'file','bytes':p.stat().st_size,'mode':oct(stat.S_IMODE(p.stat().st_mode)),'sha256':h})
          manifest={'schema':'musitu.foundry_forge.exact_target_runtime_bundle.v1','target':{'python':'3.12.13','system':'Linux','machine':'x86_64','glibc':'2.39'},'tesseract_binary_sha256':'6ad0afbf020337487c0d103421e430f5e22ed8eefc0eb7420af002a850d1a1e8','tessdata_fast_commit':'87416418657359cb625c412a48b6e1d6d41c29bd','files':rows,'file_count':len(rows),'private_product_bytes_included':False}
          Path('runtime-evidence/RUNTIME_ROOTFS_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          tar --numeric-owner --sort=name --mtime='UTC 2026-09-12 00:00:00' --owner=0 --group=0 -C runtime-rootfs -czf foundry-forge-exact-target-runtime-ubuntu2404-cpython31213.tgz .
          sha256sum foundry-forge-exact-target-runtime-ubuntu2404-cpython31213.tgz | tee runtime-evidence/RUNTIME_BUNDLE_SHA256.txt
          sha256sum runtime-evidence/RUNTIME_ROOTFS_MANIFEST.json | tee runtime-evidence/RUNTIME_MANIFEST_SHA256.txt

      - name: Persist exact target runtime bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: foundry-forge-exact-target-runtime-ubuntu2404-cpython31213
          path: |
            foundry-forge-exact-target-runtime-ubuntu2404-cpython31213.tgz
            runtime-evidence/PLATFORM.json
            runtime-evidence/BUILD_DEPENDENCIES.tsv
            runtime-evidence/TESSERACT_LANGS.txt
            runtime-evidence/CHROOT_TESSERACT_LANGS.txt
            runtime-evidence/RUNTIME_ROOTFS_MANIFEST.json
            runtime-evidence/RUNTIME_BUNDLE_SHA256.txt
            runtime-evidence/RUNTIME_MANIFEST_SHA256.txt
          if-no-files-found: error
          compression-level: 0
