name: MUSITU FOUNDRY FORGE Reusable Authority Probe

on:
  workflow_call:
    secrets:
      MODAL_TOKEN_ID:
        required: false
      MODAL_TOKEN_SECRET:
        required: false
      CLOUDFLARE_GLOBAL_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  authority-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report inherited secret presence only
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$MODAL_TOKEN_ID" ]; then echo 'modal_token_id_present=true'; else echo 'modal_token_id_present=false'; fi
          if [ -n "$MODAL_TOKEN_SECRET" ]; then echo 'modal_token_secret_present=true'; else echo 'modal_token_secret_present=false'; fi
          if [ -n "$CLOUDFLARE_GLOBAL_API_KEY" ]; then echo 'cloudflare_global_api_key_present=true'; else echo 'cloudflare_global_api_key_present=false'; fi
